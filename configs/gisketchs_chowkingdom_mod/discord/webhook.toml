# Chow Kingdom config: webhook.toml. Edit while the game is stopped, then run reload commands or restart.

# Config value: enabled.
enabled = false
# Config value: webhook_url.
webhook_url = ""
# Config value: webhook_username.
webhook_username = "Chow Kingdom"
# Config value: avatar_url.
avatar_url = ""
# Config value: player_chat_identity.
player_chat_identity = true
# Config value: debug_avatar_resolution.
debug_avatar_resolution = true
# Config value: minecraft_avatar_url_template.
minecraft_avatar_url_template = "https://mc-heads.net/avatar/{uuid}/128"
# Config value: quick_skin_avatar_url_template.
quick_skin_avatar_url_template = ""
# Config value: relay_chat.
relay_chat = true
# Config value: relay_join_leave.
relay_join_leave = false
# Config value: relay_deaths.
relay_deaths = true
# Config value: relay_battlepass_completions.
relay_battlepass_completions = true
# Config value: relay_status.
relay_status = true
# Config value: status_interval_seconds.
status_interval_seconds = 300

# Config value: player_avatar_urls.
[player_avatar_urls]

# Config value: quick_skin_avatar_server.
[quick_skin_avatar_server]
# Config value: quick_skin_avatar_server.enabled.
enabled = false
# Config value: quick_skin_avatar_server.bind_host.
bind_host = "0.0.0.0"
# Config value: quick_skin_avatar_server.port.
port = 8765
# Config value: quick_skin_avatar_server.public_base_url.
public_base_url = ""

# Config value: formatting.
[formatting]
# Config value: formatting.chat_message.
chat_message = "{message}"
# Config value: formatting.chat_fallback_message.
chat_fallback_message = "**{player}**: {message}"
# Config value: formatting.join_title.
join_title = "Player Joined"
# Config value: formatting.join_description.
join_description = "{player} joined. {online}/{max} players online"
# Config value: formatting.join_color.
join_color = "#57F287"
# Config value: formatting.leave_title.
leave_title = "Player Left"
# Config value: formatting.leave_description.
leave_description = "{player} left. {online}/{max} players online"
# Config value: formatting.leave_color.
leave_color = "#ED4245"
# Config value: formatting.death_title.
death_title = "Player Died"
# Config value: formatting.death_description.
death_description = "{death_message}"
# Config value: formatting.death_color.
death_color = "#ED4245"
# Config value: formatting.battlepass_title.
battlepass_title = "[[{battlepass}]] {scope} Mission Complete"
# Config value: formatting.battlepass_description.
battlepass_description = "{player} completed \"{mission}\" {scope_lower} mission. {player_raw} now has {xp} XP."
# Config value: formatting.battlepass_color.
battlepass_color = "#FEE75C"
# Config value: formatting.status_message.
status_message = "Server status: {online}/{max} players online | TPS {tps}"
