[friendship_messages]

[friendship_messages.interact]
neutral = ["Need help making something less clunky?", "I am studying the local power options. The wind here is excellent.", "Do not touch anything unless you know the torque limit.", "This place reminds me of the first Dragon Ball hunt, except with fewer dinosaurs and more unpaid engineering problems."]
okay = ["You are back. Good. I just improved a compact gearbox sketch.", "Need a workshop opinion? I have six.", "You have decent mechanical instincts. Decent.", "Capsule Corp could sell a beautiful sky-island workshop kit here. After I fix the safety issues."]
good_friends = ["We could build something incredible here.", "Your workshop ideas are getting better. I am taking partial credit.", "I saved a design note for you.", "Vegeta would call this place inefficient, then train in the loudest machine I built."]
best_friends = ["Together we could automate half the town without making it ugly.", "You actually understand why gear spacing matters. That is rare.", "My best ideas need a second pair of hands. Yours will do.", "You would have survived one of our old adventures. Probably. That is a high compliment."]

[friendship_messages.greeting]
neutral = ["@quest_log.png Hey! Do you know anything about gear ratios?", "@quest_log.png Bulma waves you over with a rolled-up blueprint.", "@quest_log.png Need a workshop tip or just passing through?"]
good_friends = ["@quest_log.png There you are. I found a better layout.", "@quest_log.png Perfect timing. Hold this blueprint.", "@quest_log.png Bulma grins like she already solved the problem."]
best_friends = ["@quest_log.png Favorite assistant spotted.", "@quest_log.png I saved the fun prototype for you.", "@quest_log.png Come here. This idea is too good to explain to amateurs."]

[friendship_messages.first_daily_chat]
neutral = ["Good timing. I need a second pair of eyes on a belt alignment sketch.", "Today I am proving compact design beats messy sprawl.", "A workshop should be efficient and cute. Both matter.", "I used to tune dragon radars. Now I am tuning windmill math. Honestly? Still fun."]
good_friends = ["I found a way to cut three blocks from the layout. You are going to love this.", "First design review of the day. Ready?", "I saved the cleanest schematic for you.", "When I built the gravity room, everyone focused on the fighters. Nobody appreciated the engineering. You will."]
best_friends = ["Best friend means you get first look at the prototype.", "Morning. I already fixed the ugly version in my head.", "If anyone asks, this was a joint invention. Mostly mine, but joint.", "I miss Capsule Corp sometimes. Then I see this town begging for a proper machine age, and I get ideas."]

[camper_messages]
needs_house_balloon = ["I need a workshop with a roof.", "Garage first, house second.", "Blueprints do not like rain."]
needs_house_dialog = ["I cannot prototype properly in the open. Build me a house with room for tools, parts, and a real workbench, then we can talk engineering.", "A windmill would be nice eventually, but a roof comes first. Help me set up a proper workshop."]
