[boss]
enabled = true
health = 100.0
damage = 4.0
template = "sword_user"
main_hand = "witcher_rpg:steel_witcher_sword"
off_hand = ""

[boss.balloons]
chase = ["You think you can outrun me?", "I've tracked worse through swamps.", "Not fast enough.", "Where do you think you're going?", "The Path doesn't forgive hesitation.", "Stop running and face me.", "I'll find you.", "This ends now."]
attack = ["Hyah!", "Wolf school taught me that.", "Taste steel.", "Aard!", "Igni!", "You're in my reach now.", "Quen holds. I strike.", "Yrden. Now."]
recovery = ["Need a moment.", "That stung. Had worse.", "Breathe. Still fight.", "I can keep going.", "A witcher doesn't stay down.", "Just catching my breath.", "Not done yet.", "Get up. Again."]
taunt = ["Is that all?", "I've faced leshens with more bite.", "You're slower than a wyvern in winter.", "Keep trying. Maybe you'll land one.", "You call that a strike?", "Pathetic form.", "I expected more.", "Your stance is begging to be punished."]
guard_react = ["Blocked.", "You'll have to do better.", "Reflexes stay sharp.", "Parried.", "Too slow.", "I saw that coming.", "Nice try.", "Not today."]
parry = ["Got you.", "Riposte.", "You left yourself open.", "Too easy.", "I learned that from Geralt.", "Counter.", "Bad angle.", "Again. Cleaner."]
hit_player = ["Hit.", "Direct.", "That hurt, didn't it?", "Solid blow.", "You'll feel that tomorrow.", "One more and you're done.", "Blood. Good.", "Keep testing me."]
took_damage = ["Lucky shot.", "That will bruise.", "You got me. Once.", "I've taken worse from drowners.", "Not bad. Not enough.", "Pain teaches.", "That woke me up.", "Good. Now focus."]
victory = ["It's over.", "Another lesson done.", "The Path continues.", "You fought well. Rest now.", "I win.", "Breathe. Learn.", "Get up when you can.", "Lesson learned."]
defeat = ["Enough. You win.", "Good fight.", "The Path humbles everyone.", "Geralt would nod.", "I yield.", "Clean work.", "You earned that.", "Again tomorrow."]

