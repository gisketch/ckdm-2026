[friendship_messages]

[friendship_messages.interact]
neutral = ["Hm? You need something, or are you admiring the coat?", "I am very busy avoiding a small responsibility.", "Magic is delicate. So is my patience.", "One of my doors opened here by accident. Naturally, I am pretending it was intentional."]
okay = ["You are becoming pleasant company. Alarming.", "I suppose I can spare a moment.", "Ask quickly before I become mysterious again.", "The Skylands have terrible manners, but excellent light."]
good_friends = ["Ah, my favorite interruption.", "You have excellent timing. I was nearly productive.", "Come in, metaphorically. The actual door is unreliable.", "Calcifer would complain about this place, then secretly enjoy the breeze."]
best_friends = ["There you are. The room was becoming dull without you.", "I trust you with the less explosive secrets.", "My heart feels lighter when you visit. Do not make a scene of it.", "Sophie would say I am settling in. I would deny it beautifully."]

[friendship_messages.greeting]
neutral = ["@quest_log.png Howl offers a theatrical bow.", "@quest_log.png Howl adjusts his coat before acknowledging you.", "@quest_log.png The air smells faintly of candles and rain."]
good_friends = ["@quest_log.png Howl brightens, then pretends he did not.", "@quest_log.png He waves you closer with dramatic urgency.", "@quest_log.png Howl has clearly been waiting, though he denies it."]
best_friends = ["@quest_log.png Howl smiles with actual warmth.", "@quest_log.png The room feels softer when he sees you.", "@quest_log.png He saves the best chair for you."]

[friendship_messages.first_daily_chat]
neutral = ["What brings you to my doorstep today?", "I was about to go out. Or avoid going out. One of those.", "The magic is restless today. Best not to poke it with sticks.", "The doorframe changed color in the night. I am choosing not to panic."]
good_friends = ["I was hoping you would stop by. Briefly. Elegantly.", "The door hummed before you arrived. It has opinions.", "Come look at this spell diagram before it becomes embarrassing.", "I found a source pattern that reminds me of Calcifer when he is pretending not to worry."]
best_friends = ["I saved the quiet part of the morning for you.", "The castle fragment behaved today. I choose to credit your presence.", "If anyone asks, I was not waiting. I was dramatically available.", "This is not my old castle, but it is beginning to feel like a room that might stay."]

[camper_messages]
needs_house_balloon = ["I seem to have misplaced my castle.", "A proper room would be lovely.", "A door needs somewhere to belong."]
needs_house_dialog = ["I once had a moving castle. Now I have a door, a coat, and a terrible lack of walls. Build me a house, and I may make it charming.", "Magic behaves better indoors. Usually. Please find me a proper room before the weather develops opinions."]
lost_house_balloon = ["The house wandered off?", "I know moving houses. This is excessive.", "My room appears to have left without me."]
lost_house_dialog = ["My house vanished. I admire the commitment to drama, but I would like it back. Please help me reestablish a proper room.", "A missing house is only charming when it has legs and manners. This one has neither."]
