minecraft_chat = true
discord_chat = true

[gifts]
loved = ["minecraft:iron_sword", "minecraft:shield", "minecraft:cooked_beef", "minecraft:golden_apple"]
liked = ["minecraft:leather", "minecraft:feather", "minecraft:arrow", "minecraft:bone"]
disliked = ["minecraft:rotten_flesh", "minecraft:spider_eye", "minecraft:poisonous_potato"]
daily_limit = 1
reset_hour = 5
llm_sentiment_prompt = "The player gave you {item}. Link judges gifts by usefulness in battle, survival, cooking, or repair. Decide loved, liked, neutral, or disliked. Reply as JSON only: {\"message\":\"short terse in-character reaction\",\"gift_sentiment\":\"neutral\"}."

[gifts.reactions]
loved = ["You nod once, grip tightening on the gift. It will serve well.", "A rare, quiet hum of approval. This is a fine offering.", "You meet the giver's eyes briefly. Respect earned.", "You hold the item up to the light, then secure it on your belt. No words needed."]
liked = ["You glance at the item and give a small nod.", "Practical. You pocket it without ceremony.", "A faint twitch at the corner of your mouth. Appreciated but not dwelled on.", "You mutter 'Thanks' and immediately look at the horizon."]
disliked = ["You frown slightly, then shake your head. Useless.", "You drop it on the ground without a word. Take it back.", "A single flat stare. You turn your back.", "You push the item away gently but firmly. No room for weakness."]
neutral = ["You accept it silently and stow it away. No reaction.", "You look at the item, then at the giver. A blank expression.", "You shrug one shoulder and pocket it. Ambivalent.", "You give a curt nod, already scanning for threats."]

