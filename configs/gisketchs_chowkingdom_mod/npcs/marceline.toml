recovery = ["Breathe. Feel the night air.", "Get up. You're not done.", "Take a second. Then we go again.", "Pain is a teacher. Listen.", "Still standing. Good.", "That was sloppy. Fix it.", "Regroup. You've got more.", "The dark helps. Let it."]
