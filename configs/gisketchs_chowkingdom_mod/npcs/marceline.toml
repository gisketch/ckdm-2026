[boss.balloons]
chase = ["You run, but you can't hide from the night.", "Come on, show me what you've got.", "I can smell your fear. Sweet.", "Keep moving. This is how you learn.", "You think that's fast?", "I'll give you a head start. One... two...", "The hunt is on, little warrior.", "Don't lose the rhythm."]
