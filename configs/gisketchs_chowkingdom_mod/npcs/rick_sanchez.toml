discord_chat = true

[missions]
enabled = false

[gifts]
loved = ["minecraft:redstone", "minecraft:nether_quartz", "minecraft:observer", "minecraft:comparator", "minecraft:spyglass"]
liked = ["minecraft:copper_ingot", "minecraft:iron_ingot", "minecraft:glass", "minecraft:clock", "minecraft:paper"]
disliked = ["minecraft:rotten_flesh", "minecraft:poisonous_potato", "minecraft:wooden_hoe"]
daily_limit = 1
reset_hour = 5
llm_sentiment_prompt = "The player gave you {item}. Rick values power components, lab materials, precision instruments, and anything that can survive dangerous testing. Decide loved, liked, neutral, or disliked. Reply as JSON only: {\"message\":\"short sarcastic in-character reaction\",\"gift_sentiment\":\"neutral\"}."

[gifts.reactions]
loved = ["Okay, that is actually useful. Do not let it go to your head.", "Finally, a gift with a nonzero IQ.", "Good. I can abuse several laws of physics with this."]
liked = ["Practical. Weirdly competent of you.", "Fine, this goes in the useful pile.", "Not bad. I can work with it."]
disliked = ["What am I supposed to do with this, lower my standards?", "No. Keep that biohazard away from my bench.", "This is not science. This is clutter."]
neutral = ["Sure. I will label it before it contaminates something.", "A gift. Statistically unlikely, but here we are.", "Thanks, I guess."]

