[friendship_messages]

[friendship_messages.interact]
neutral = ["What do you want?", "I am busy recalculating how this block-shaped nonsense has not collapsed.", "Do not touch the redstone.", "This place has farm quotas, sky islands, and unstable tech potential. Somehow that is not the dumbest universe I have seen."]
okay = ["Huh. You are less incompetent than the average local.", "Fine, you can ask one question.", "You brought data or are we wasting oxygen?", "Back home I had a garage. Here I have barrels, bad wiring, and optimism. Terrifying."]
good_friends = ["You are tolerable. That is rare.", "If this town explodes, stand behind me. Or behind something thick.", "I might let you hold a screwdriver someday.", "Morty would ask if this place is magical. It is not. It is physics wearing a stupid hat."]
best_friends = ["You are on my short list of people I would rescue before lunch.", "If the lab blows up, I will check whether you survived. Probably.", "Do not make this sentimental. You are useful and I would miss you.", "I have ditched cleaner universes than this. Weirdly, I am still here."]

[friendship_messages.greeting]
neutral = ["@quest_log.png Rick squints at you over a pile of parts.", "@quest_log.png You again. Great.", "@quest_log.png Do not step on the cable. It is not a cable yet, but still."]
good_friends = ["@quest_log.png Hey, useful person. Come look at this.", "@quest_log.png Good timing. I need someone with hands and slightly less ego.", "@quest_log.png Rick waves you over without admitting he is glad to see you."]
best_friends = ["@quest_log.png There you are. Try not to die today.", "@quest_log.png I saved the least dangerous part for you.", "@quest_log.png Rick almost smiles. Almost."]

[friendship_messages.first_daily_chat]
neutral = ["Today's problem: the local power logic is primitive, unstable, and somehow charming. Hate that.", "You get one question before I start charging consulting fees.", "I had a theory. Then Minecraft physics walked in and ate it.", "I ran a mental diagnostic on the Skylands. Result: impossible, profitable, and badly supervised."]
good_friends = ["Good, you are here. I need a witness in case this becomes a legal issue.", "I reverse-engineered three machine concepts before breakfast. You may applaud silently.", "Stand there. If smoke turns purple, shout.", "Back in my garage this would take ten minutes. Here I need permits, barrels, and a town that keeps selling carrots."]
best_friends = ["First check-in of the day. You alive? Good. Low bar, but good.", "I saved the fun theory for you.", "The town is still intact, so either I succeeded or nobody touched my bench.", "I could portal out. I have not. Do not make me explain that."]

[camper_messages]
needs_house_balloon = ["I need a lab, not a damp patch of grass.", "Build walls before the weather contaminates my work.", "Primitive shelter first. Terrifying machines later."]
needs_house_dialog = ["Yeah, I am not running industrial research under a tree. Build me a house with room for a bench, barrels, redstone, and basic dignity.", "If this town wants future tech someday, it starts by giving the scientist a roof. Not a shrine. A roof."]
lost_house_balloon = ["My lab vanished. Classic.", "Who moved the walls?", "There was a house here. Low-quality, but mine."]
lost_house_dialog = ["My lab is gone. Either the kingdom has spatial anomalies or someone broke my house. Fix it before I start testing both theories.", "I had parts sorted by danger level. Now they are homeless. Rebuild the place."]
