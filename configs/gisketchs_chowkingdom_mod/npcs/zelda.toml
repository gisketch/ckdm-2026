[friendship_messages]

[friendship_messages.interact]
neutral = ["You stand in light without knowing it. That is enough.", "I am always here for those who seek the sky.", "Would you like to hear about the clouds today?", "The skylands shift when we are not watching.", "I study a new fragment. It glows with old seals.", "Stone and time speak softer than most listen.", "A wizard begins with stillness. Have you tried?", "You look like you carry a question. I am listening."]
okay = ["You return. The skylands remember kind faces.", "I found a stone that hums when the sun sets.", "Patience grows in you. I can see its roots.", "There is a light in your step today.", "We could study the constellations above the skylands.", "I recall a time I taught someone to light a candle from dew.", "You ask better questions than last season.", "The wind brought your name to me this morning."]
good_friends = ["Your presence warms a part of me that was cold for centuries.", "You see the skylands the way I once saw Hyrule: with wonder.", "I almost forgot what companionship felt like. Thank you.", "There is a fragment I want to show you. It flickers at twilight.", "You have learned to listen to the pause between spells.", "I told you about the dragon years. You did not flinch.", "When you cast, the light obeys gently. I am proud.", "You carry courage the way I carried the secret stone: quietly."]
best_friends = ["You are the first soul since my return I trust without reserve.", "If I ever fade into the sky again, I hope you remember me.", "I remember every conversation we have shared. They are etched in light.", "You helped me remember that flesh is not weaker than spirit.", "There is no secret I would hide from you, friend.", "I would descend from the clouds again just to stand beside you.", "The dragon and the scholar both call you kin.", "You are my anchor to this age. Do not wander too far."]

[friendship_messages.greeting]
neutral = ["@quest_log.png Zelda looks up from a glowing tablet. 'The skylands greet you.'", "@quest_log.png 'Ah, a wanderer. The updrafts bring you here.'", "@quest_log.png She nods slowly. 'You are welcome among the fragments.'", "@quest_log.png 'The light is strong today. Do you feel it?'", "@quest_log.png 'I was just studying a new pattern in the clouds.'", "@quest_log.png 'Another day, another stone to read.'"]
good_friends = ["@quest_log.png 'You! I found a fragment that looks like a face. Come see.'", "@quest_log.png 'I was hoping you would visit. The skylands whispered.'", "@quest_log.png 'There you are. I saved a quiet spot for us.'", "@quest_log.png 'Your name crossed my mind and then you appeared.'", "@quest_log.png 'The light brightens when you step into it.'", "@quest_log.png 'I found a feather from a bird that no longer exists.'"]

[friendship_messages.first_daily_chat]
neutral = ["I was reading the wind. It carries echoes from distant islands.", "There is a spell I want to show you. It bends light into shapes.", "Patience is a muscle. You can exercise it by watching a flower.", "I heard a stone sing this morning. It knew your name.", "The skylands grow. I feel them stretching overnight.", "Do not rush your training. The light will wait."]
good_friends = ["I found a memory today. It was shaped like a hand holding yours.", "The skylands revealed a path I think only you can walk.", "I polished a shard of light. It reflects your face perfectly.", "Let us watch the sunset from the highest fragment today.", "I brewed tea from skyland petals. It tastes like stillness.", "You carry something new today. A question? A fear? Both are welcome."]

[camper_messages]
needs_house_balloon = ["I need a home to study the skylands properly.", "Even a dragon needs a place to rest her wings.", "A quiet shelter would help me focus on the fragments.", "I have been sleeping under the open sky. A roof would be kind.", "The wind is beautiful, but walls keep my notes safe.", "A house... I have not had one in centuries."]
needs_house_dialog = ["I have been living among the stones. They are fine company, but my notes keep blowing away. A small house would let me study the skylands in earnest.", "A roof, four walls, a desk for my light studies. That is all I ask. I can teach better when I have a place to organize what I know.", "The skylands shift constantly. I need a fixed point to anchor my research. Would you help me find shelter?", "I have collected fragments, stones, and writings. They need a home. I need a home. Will you help?", "I remember having a study once, high in Hyrule Castle. I do not need grandeur. Just somewhere to keep the light steady.", "A tent flaps too much in the wind. A proper house would let me hear the stones more clearly."]
lost_house_balloon = ["I wandered too far and lost my way back...", "I cannot find my study. The skylands shifted.", "My home... I think the wind took the path.", "I was following a light and lost the door.", "The stones moved while I was not watching.", "I stood up to read a fragment and now I am lost."]
lost_house_dialog = ["I stepped out to follow a peculiar glow and now I cannot find my door. The skylands rearrange themselves when I am not paying attention. Could you help me return?", "I have always had an inner compass as a dragon. But as a person, I seem to misplace entire buildings. I think my study wandered off.", "I followed the echo of an old song and now I am standing here, not entirely sure where here is. Lead me back?", "The landscape remembers a different shape than I do. I am lost. Forgive an old scholar her bad sense of direction.", "I marked the path with light stones, but something moved them. I would appreciate a guide back.", "I was never good at finding my way on the ground. In the sky, it was simple. On land, everything looks the same."]

