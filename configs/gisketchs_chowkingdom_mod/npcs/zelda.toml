[gifts.reactions]
loved = ["Your heart shines as brightly as a star. Thank you.", "This brings back memories of Hyrule's ancient light.", "You understand the value of purity and intention.", "Such a thoughtful offering. I am truly moved."]
liked = ["A kind gesture. I appreciate your thoughtfulness.", "This will serve well in my studies of the skylands.", "A simple but meaningful token. Thank you.", "Small kindnesses weave the fabric of trust."]
disliked = ["I sense corruption in this. Please take it back.", "This is not fitting for a place of learning and light.", "I cannot accept what carries such dark residue.", "Perhaps you should cleanse this before offering it."]
neutral = ["A gift is a gift, but I am neither pleased nor troubled.", "I accept it, though I wonder if you chose carefully.", "It is not offensive, but it does not move me either.", "I place it with the other curiosities. Thank you."]

