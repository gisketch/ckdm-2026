[boss.balloons]
chase = ["You cannot outrun the wisdom of ages.", "The light guides my aim. Stand steady.", "I have studied the skylands. I see your path.", "Why flee? There is no shadow that can hide you.", "Time is patient, and so am I.", "Your retreat only delays the lesson.", "The winds of the skylands carry my voice.", "You run from light itself?"]
attack = ["Feel the weight of restrained power.", "A beam of pure intent.", "Light bends, but it does not break.", "This is discipline, not anger.", "I strike not to harm, but to teach.", "Knowledge tempers strength.", "The ancient sages left more than ruins.", "A measured strike for a measured foe."]
recovery = ["The light renews me.", "Patience. I draw from the sky above.", "A breath, a prayer, and I stand again.", "The glow of the sun rekindles my spirit.", "This is only a pause in the lesson.", "Even bright flame may flicker.", "I gather the scattered rays around me.", "Restoration is the first gift of light."]
taunt = ["Is this all your ambition amounts to?", "You fight with haste, not thought.", "I have waited ages. I can outlast your stamina.", "A true wizard knows restraint.", "The skylands teach that every motion has a cost.", "Your anger clouds your judgment. Breathe.", "You exhaust yourself chasing a phantom.", "Have you forgotten what ruin haste can bring?"]
guard_react = ["A sturdy defense, but can it hold against light?", "You block well, but light finds the crack.", "The light passes through all barriers in time.", "I respect caution, but caution alone wins no wars.", "Guard if you must. I will wait.", "A wall means little to truth.", "You hide behind your guard. Show conviction.", "Good. Now learn when to lower it."]
parry = ["Your resistance sharpens my focus.", "A clever move, but I have seen it before.", "You turn strength aside. Impressive.", "The light is not so easily redirected.", "I anticipated that.", "A parry is a conversation. You spoke too soon.", "Your timing is good. Improve your aim.", "You read the spell, but not the pause."]
hit_player = ["A touch of light to remind you of your path.", "That was a lesson. Learn from it.", "You felt that, yes? Remember the feeling.", "The light does not wound. It illuminates.", "Precision over power.", "The skylands taught me economy of motion.", "Each strike carries ancient wisdom.", "Pause. Breathe. Continue."]
took_damage = ["A hit. You are more capable than I assumed.", "Pain is a teacher. I will listen.", "You surprise me. The light flickers but holds.", "That stings, but I have endured far worse.", "Good. You force me to concentrate.", "So this is mortal ferocity. Impressive.", "Well struck. Do not waste the opening.", "The lesson turns back on the teacher."]
victory = ["The light prevails. You fought with passion, but not wisdom.", "I hope defeat teaches more than victory could.", "Rise. The lesson continues with a humbler heart.", "You have felt tempered strength. Rest now.", "The skylands witnessed your effort.", "Even in loss, there is growth.", "The battle is over. The real challenge begins inside you.", "You are healed. Carry the lesson gently."]
defeat = ["I have underestimated you. The light bows.", "You have bested a student of the skylands.", "The cycle continues. Your strength is undeniable.", "Perhaps I still have much to learn from this world.", "I yield. The knowledge you carry is formidable.", "The light bows before a greater fire. Well fought.", "My teachings are incomplete. I will study this.", "Even light can stumble. You have earned my respect."]

