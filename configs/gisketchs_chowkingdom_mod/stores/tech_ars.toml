# CKDM Tech Store: Howl's Ars Study
#
# Design:
# - Daily stock supports early spell setup and source crafting.
# - Weekly stock sells renewable magical materials in very limited quantities.
# - Excluded by design: Drygmy items, familiars, rituals, flight/glide/launch/leap
#   mobility, spell turrets, source links, mob jars, and advanced spell books.

