# CKDM Tech Store: Bulma's Create Workshop
#
# Design:
# - Daily stock covers belts, shafts, funnels, pipes, and starter workshop tools.
# - Weekly stock adds convenience machinery without selling major progression skips.
# - Excluded by design: precision mechanisms, blaze burners, brass bulk, trains,
#   mechanical crafters, creative items, and high-power CreateAddition machines.

