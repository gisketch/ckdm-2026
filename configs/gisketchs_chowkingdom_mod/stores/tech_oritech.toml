# CKDM Tech Store: Rick's Oritech Lab
#
# Design:
# - Daily stock supports wiring, early processing, and first-tier machine parts.
# - Weekly stock sells one or two useful machines or augments at high prices.
# - Excluded by design: deep drill, lasers, quarry, resource nodes, jetpacks,
#   exo armor, reactors, nukes, advanced cores, plutonium, and endgame materials.

